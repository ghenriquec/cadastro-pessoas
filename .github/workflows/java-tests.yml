name: Java backend tests

on:
  push:
    branches:
      - fix/people-registration-spring3-validation-2026
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/java-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend unit tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml test
